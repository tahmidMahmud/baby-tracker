<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#04050e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baby">
  <meta name="robots" content="noindex, nofollow">
  <title>Baby Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="stars"></div>
    <div class="stars stars2"></div>
    <div class="moon"></div>
  </div>
  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home">
      <span class="tab-icon" data-icon="home"></span><span>Home</span>
    </button>
    <button class="tab" data-tab="history">
      <span class="tab-icon" data-icon="list"></span><span>History</span>
    </button>
    <button class="tab" data-tab="stats">
      <span class="tab-icon" data-icon="chart"></span><span>Trends</span>
    </button>
    <button class="tab" data-tab="settings">
      <span class="tab-icon" data-icon="sliders"></span><span>Settings</span>
    </button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <div id="sheet" class="sheet hidden"></div>

  <script src="js/config.js?v=6"></script>
  <script src="js/icons.js?v=6"></script>
  <script src="js/schedules.js?v=6"></script>
  <script src="js/trends.js?v=6"></script>
  <script src="js/store.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
